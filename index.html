<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Funding Rate 看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .apr-high { color: #ef4444; font-weight: bold; }
        .apr-med { color: #f59e0b; font-weight: bold; }
        .apr-low { color: #10b981; }
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .loading { animation: pulse 1.5s infinite; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400">📊 Kevin 資金費率實時看板</h1>
            <div id="last-update" class="text-slate-400 text-sm">正在獲取數據...</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="card p-4 rounded-lg shadow-lg">
                <div class="text-slate-400 text-sm">最高年化 (Hyna)</div>
                <div id="hyna-top" class="text-2xl font-bold text-red-500">--%</div>
            </div>
            <div class="card p-4 rounded-lg shadow-lg">
                <div class="text-slate-400 text-sm">監控幣種總數</div>
                <div id="total-coins" class="text-2xl font-bold text-blue-400">--</div>
            </div>
            <div class="card p-4 rounded-lg shadow-lg">
                <div class="text-slate-400 text-sm">數據來源</div>
                <div class="text-xl font-bold text-green-400">HL, Hyna, Binance, Bybit</div>
            </div>
        </div>

        <div class="card rounded-xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-800 text-slate-300">
                        <tr>
                            <th class="p-4">平台</th>
                            <th class="p-4">幣種</th>
                            <th class="p-4 text-right">預計年化 (APR)</th>
                            <th class="p-4 text-right">時費率 (%)</th>
                        </tr>
                    </thead>
                    <tbody id="funding-table" class="divide-y divide-slate-700">
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchHL(dex) {
            try {
                const response = await fetch('https://api.hyperliquid.xyz/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'metaAndAssetCtxs', dex: dex || undefined })
                });
                const [meta, contexts] = await response.json();
                const platformName = dex === 'hyna' ? 'Hyna' : (dex === 'xyz' ? 'TradeXYZ' : 'Hyperliquid');
                return meta.universe.map((asset, i) => {
                    const ctx = contexts[i];
                    if (ctx?.funding) {
                        const funding = parseFloat(ctx.funding);
                        return {
                            platform: platformName,
                            symbol: asset.name.replace(`${dex}:`, ''),
                            apr: funding * 24 * 365 * 100,
                            hourly: funding * 100
                        };
                    }
                    return null;
                }).filter(Boolean);
            } catch (e) {
                console.error(`HL ${dex} error:`, e);
                return [];
            }
        }

        async function fetchBinance() {
            try {
                const res = await fetch('https://fapi.binance.com/fapi/v1/premiumIndex');
                const data = await res.data || await res.json();
                return data.map(item => {
                    const rate = parseFloat(item.lastFundingRate);
                    return {
                        platform: 'Binance',
                        symbol: item.symbol,
                        apr: rate * 3 * 365 * 100,
                        hourly: (rate * 100) / 8
                    };
                });
            } catch (e) {
                console.error('Binance error:', e);
                return [];
            }
        }

        async function fetchBybit() {
            try {
                const res = await fetch('https://api.bybit.com/v5/market/tickers?category=linear');
                const data = await res.json();
                return data.result.list.map(item => {
                    const rate = parseFloat(item.fundingRate);
                    return {
                        platform: 'Bybit',
                        symbol: item.symbol,
                        apr: rate * 3 * 365 * 100,
                        hourly: (rate * 100) / 8
                    };
                });
            } catch (e) {
                console.error('Bybit error:', e);
                return [];
            }
        }

        async function updateDashboard() {
            const lastUpdateEl = document.getElementById('last-update');
            lastUpdateEl.classList.add('loading');

            const results = await Promise.all([
                fetchHL(''),
                fetchHL('xyz'),
                fetchHL('hyna'),
                fetchBinance(),
                fetchBybit()
            ]);

            let allData = results.flat();
            allData = allData.filter(d => d.apr > 0).sort((a, b) => b.apr - a.apr);

            const table = document.getElementById('funding-table');
            table.innerHTML = '';
            
            allData.slice(0, 100).forEach(item => {
                const aprClass = item.apr > 100 ? 'apr-high' : (item.apr > 50 ? 'apr-med' : 'apr-low');
                const row = `
                    <tr class="hover:bg-slate-700 transition-colors">
                        <td class="p-4">
                            <span class="px-2 py-1 rounded text-xs font-bold ${getPlatformColor(item.platform)}">
                                ${item.platform}
                            </span>
                        </td>
                        <td class="p-4 font-mono font-bold">${item.symbol}</td>
                        <td class="p-4 text-right font-mono ${aprClass}">${item.apr.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}%</td>
                        <td class="p-4 text-right font-mono text-slate-400">${item.hourly.toFixed(4)}%</td>
                    </tr>
                `;
                table.innerHTML += row;
            });

            const hynaTop = allData.find(d => d.platform === 'Hyna');
            document.getElementById('hyna-top').innerText = hynaTop ? hynaTop.apr.toFixed(2) + '%' : '--%';
            document.getElementById('total-coins').innerText = allData.length;
            
            lastUpdateEl.innerText = '最後更新: ' + new Date().toLocaleTimeString();
            lastUpdateEl.classList.remove('loading');
        }

        function getPlatformColor(p) {
            switch(p) {
                case 'Hyna': return 'bg-purple-900 text-purple-200';
                case 'TradeXYZ': return 'bg-blue-900 text-blue-200';
                case 'Binance': return 'bg-yellow-900 text-yellow-200';
                case 'Bybit': return 'bg-orange-900 text-orange-200';
                default: return 'bg-slate-700 text-slate-200';
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 60000);
    </script>
</body>
</html>
