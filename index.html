<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Funding Rate 看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .apr-pos { color: #ef4444; font-weight: bold; }
        .apr-neg { color: #10b981; font-weight: bold; }
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .loading { animation: pulse 1.5s infinite; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">📊 Kevin 資金費率實時看板</h1>
                <div id="last-update" class="text-slate-400 text-sm mt-1">正在初始化數據...</div>
            </div>
            <div class="w-full md:w-64">
                <input type="text" id="search" placeholder="搜尋幣種 (如: ZEC)..." 
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="card p-4 rounded-lg shadow-lg">
                <div class="text-slate-400 text-sm">最高正年化 (Short Perp)</div>
                <div id="top-pos" class="text-2xl font-bold text-red-500">--%</div>
            </div>
            <div class="card p-4 rounded-lg shadow-lg">
                <div class="text-slate-400 text-sm">最高負年化 (Long Perp)</div>
                <div id="top-neg" class="text-2xl font-bold text-green-500">--%</div>
            </div>
            <div class="card p-4 rounded-lg shadow-lg">
                <div class="text-slate-400 text-sm">監控狀態</div>
                <div class="text-xl font-bold text-blue-400">🟢 全平台連線正常</div>
            </div>
        </div>

        <div class="card rounded-xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-800 text-slate-300">
                        <tr>
                            <th class="p-4">平台</th>
                            <th class="p-4">幣種</th>
                            <th class="p-4 text-right">預計年化 (APR)</th>
                            <th class="p-4 text-right">建議策略</th>
                            <th class="p-4 text-right">時費率 (%)</th>
                        </tr>
                    </thead>
                    <tbody id="funding-table" class="divide-y divide-slate-700">
                        <!-- Data rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let fullData = [];

        async function fetchHL(dex) {
            try {
                const response = await fetch('https://api.hyperliquid.xyz/info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'metaAndAssetCtxs', dex: dex || undefined })
                });
                const [meta, contexts] = await response.json();
                const platformName = dex === 'hyna' ? 'Hyna' : (dex === 'xyz' ? 'TradeXYZ' : 'Hyperliquid');
                return meta.universe.map((asset, i) => {
                    const ctx = contexts[i];
                    if (ctx?.funding) {
                        const funding = parseFloat(ctx.funding);
                        return {
                            platform: platformName,
                            symbol: asset.name.replace(`${dex}:`, ''),
                            apr: funding * 24 * 365 * 100,
                            hourly: funding * 100
                        };
                    }
                    return null;
                }).filter(Boolean);
            } catch (e) { return []; }
        }

        async function fetchBinance() {
            try {
                const res = await fetch('https://fapi.binance.com/fapi/v1/premiumIndex');
                const data = await res.json();
                return data.map(item => {
                    const rate = parseFloat(item.lastFundingRate);
                    return {
                        platform: 'Binance',
                        symbol: item.symbol,
                        apr: rate * 3 * 365 * 100,
                        hourly: (rate * 100) / 8
                    };
                });
            } catch (e) { return []; }
        }

        async function fetchBybit() {
            try {
                const res = await fetch('https://api.bybit.com/v5/market/tickers?category=linear');
                const data = await res.json();
                return data.result.list.map(item => {
                    const rate = parseFloat(item.fundingRate);
                    return {
                        platform: 'Bybit',
                        symbol: item.symbol,
                        apr: rate * 3 * 365 * 100,
                        hourly: (rate * 100) / 8
                    };
                });
            } catch (e) { return []; }
        }

        async function updateDashboard() {
            const lastUpdateEl = document.getElementById('last-update');
            lastUpdateEl.classList.add('loading');

            const results = await Promise.all([
                fetchHL(''), fetchHL('xyz'), fetchHL('hyna'),
                fetchBinance(), fetchBybit()
            ]);

            fullData = results.flat().sort((a, b) => Math.abs(b.apr) - Math.abs(a.apr));
            renderTable();

            const topPos = fullData.filter(d => d.apr > 0).sort((a,b) => b.apr - a.apr)[0];
            const topNeg = fullData.filter(d => d.apr < 0).sort((a,b) => a.apr - b.apr)[0];
            
            document.getElementById('top-pos').innerText = topPos ? topPos.apr.toFixed(2) + '%' : '--%';
            document.getElementById('top-neg').innerText = topNeg ? topNeg.apr.toFixed(2) + '%' : '--%';
            
            lastUpdateEl.innerText = '最後更新: ' + new Date().toLocaleTimeString();
            lastUpdateEl.classList.remove('loading');
        }

        function renderTable() {
            const searchTerm = document.getElementById('search').value.toUpperCase();
            const table = document.getElementById('funding-table');
            table.innerHTML = '';
            
            const filtered = fullData.filter(d => d.symbol.toUpperCase().includes(searchTerm));
            
            filtered.slice(0, 100).forEach(item => {
                const isPos = item.apr >= 0;
                const aprClass = isPos ? 'apr-pos' : 'apr-neg';
                const strategy = isPos ? 'Short Perp / Long Spot' : 'Long Perp / Short Spot';
                const strategyClass = isPos ? 'text-red-400' : 'text-green-400';

                const row = `
                    <tr class="hover:bg-slate-700 transition-colors">
                        <td class="p-4">
                            <span class="px-2 py-1 rounded text-xs font-bold ${getPlatformColor(item.platform)}">
                                ${item.platform}
                            </span>
                        </td>
                        <td class="p-4 font-mono font-bold">${item.symbol}</td>
                        <td class="p-4 text-right font-mono ${aprClass}">${item.apr.toFixed(2)}%</td>
                        <td class="p-4 text-right text-xs ${strategyClass}">${strategy}</td>
                        <td class="p-4 text-right font-mono text-slate-400">${item.hourly.toFixed(4)}%</td>
                    </tr>
                `;
                table.innerHTML += row;
            });
        }

        function getPlatformColor(p) {
            switch(p) {
                case 'Hyna': return 'bg-purple-900 text-purple-200';
                case 'TradeXYZ': return 'bg-blue-900 text-blue-200';
                case 'Binance': return 'bg-yellow-900 text-yellow-200';
                case 'Bybit': return 'bg-orange-900 text-orange-200';
                default: return 'bg-slate-700 text-slate-200';
            }
        }

        document.getElementById('search').addEventListener('input', renderTable);
        updateDashboard();
        setInterval(updateDashboard, 60000);
    </script>
</body>
</html>
